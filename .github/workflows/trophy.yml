name: Update Trophy Graph

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trophy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Trophy Graph
        uses: ryo-ma/github-profile-trophy@v2
        with:
          username: hamed-saadallah
          theme: chalk
          column: -1
          row: 1
          margin-w: 8
          margin-h: 8
          no-bg: false
          no-frame: false
          order: 4

      - name: Commit and Push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add trophy.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update trophy graph" && git push origin trophy-output)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
